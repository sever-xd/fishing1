 $('tb').innerHTML=`<span>🕐 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}</span><span>${WX[g.wx]}</span><span>📍 ${LOCS[S.loc][0]} (${LOCS[S.loc][1]} м)</span><span>📌 ${SPOTS[S.spot][0]}</span><span>🎣 ${KITS[S.kit][0]}</span><span>👥 ${Object.keys(others).length+1}</span><span>💰 ${S.money} ₽</span><span>Ур. ${lvl()}</span><span>🐟 ${kg.toFixed(1)}/${cap()} кг</span><span>Глубина: ${g.dep.toFixed(1)} м</span><span>Фрикцион: ${Math.round(g.drag)}</span>${g.gT>0?'<span>Прикормка ✓</span>':''}`;
 const L={idle:'ЗАБРОС (держи)',charge:'ОТПУСТИ!',fly:'…',wait:'МОТАТЬ',bite:'ПОДСЕЧКА!',fight:'МОТАТЬ',show:'…'};$('mb').textContent=$('mb2').textContent=L[g.st]}
function mainDown(){if(g.walkT>0)return;if(g.st=='idle'){if(!canCast())return;g.st='charge';g.pw=0;g.pd=1}else if(g.st=='bite')hook();else if(g.st=='wait'||g.st=='fight')g.reel=1}
function mainUp(){if(g.st=='charge')cast();g.reel=0}
const hold=(el,dn,up)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();dn()});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,up))};
hold($('mb'),mainDown,mainUp);hold($('pb'),()=>g.pump=1,()=>g.pump=0);cv.addEventListener('pointerdown',e=>{if(e.button==0&&e.pointerType!='touch')mainDown()});cv.addEventListener('pointerup',e=>{if(e.button==0&&e.pointerType!='touch')mainUp()});
const dep=v=>{if(g.st=='idle'||g.st=='wait'){g.dep=cl(+(g.dep+v).toFixed(1),.3,LOCS[S.loc][1]-.2);if(g.st=='wait')g.ed=edf()}};
const drg=v=>g.drag=cl(g.drag+v,10,line());
$('sb').onclick=()=>{mute=!mute;$('sb').textContent=mute?'🔇':'🔊'};function buyEco(){if(S.money>=2500){S.money-=2500;S.eco=1;save();openM()}}
const JS={x:0,y:0};
(function(){const el=$('js'),kn=$('kn');let id=null,cx=0,cy=0;const R0=40;
 const set=e=>{const dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1,m=Math.min(l,R0);JS.x=dx/l*m/R0;JS.y=dy/l*m/R0;kn.style.transform=`translate(${JS.x*R0}px,${JS.y*R0}px)`};
 el.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;el.setPointerCapture(id);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;set(e)});
 el.addEventListener('pointermove',e=>{if(e.pointerId==id)set(e)});
 const end=e=>{if(e.pointerId==id){id=null;JS.x=JS.y=0;kn.style.transform=''}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)})();
let tl=null;c2.addEventListener('pointerdown',e=>{if(e.pointerType=='touch'&&!tl)tl={id:e.pointerId,x:e.clientX,y:e.clientY}});
c2.addEventListener('pointermove',e=>{if(tl&&e.pointerId==tl.id){P.yaw-=(e.clientX-tl.x)*.006;P.pitch=cl(P.pitch-(e.clientY-tl.y)*.006,-1.2,1.2);tl.x=e.clientX;tl.y=e.clientY}});
['pointerup','pointercancel'].forEach(v=>c2.addEventListener(v,e=>{if(tl&&e.pointerId==tl.id)tl=null}));
hold($('mb2'),mainDown,mainUp);hold($('pb2'),()=>g.pump=1,()=>g.pump=0);$('pd2').onclick=podBtn;$('mnb').onclick=()=>document.body.classList.toggle('menu');
let FSF=0;
function uiMode(){document.body.classList.toggle('fs',!!document.fullscreenElement||!!FSF||(innerWidth>innerHeight&&innerHeight<520))}
function toggleFS(){const d=document;if(d.fullscreenElement||FSF){FSF=0;try{d.fullscreenElement&&d.exitFullscreen()}catch(e){}}else{FSF=1;try{d.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}}uiMode()}
$('fsb').onclick=toggleFS;['resize','orientationchange','fullscreenchange'].forEach(ev=>addEventListener(ev,()=>{if(ev=='fullscreenchange'&&!document.fullscreenElement)FSF=0;uiMode()}));uiMode();
$('lk').onclick=()=>document.pointerLockElement?document.exitPointerLock():cv.requestPointerLock();$('pdb').onclick=podBtn;
$('ks').onchange=e=>{if(g.st!='idle'){say('Смени удочку, когда снасть смотана');refreshKits();return}S.kit=e.target.value;if(S.kit=='s'&&!isL()||S.kit=='d'&&isL()){const o=Object.keys(BAIT).find(k=>k!='g'&&(S.inv[k]||0)>0&&(S.kit=='s')==LU.includes(k));if(o)S.bait=o}refreshBaits();save()};
$('d1').onclick=()=>dep(-.3);$('d2').onclick=()=>dep(.3);$('f1').onclick=()=>drg(-5);$('f2').onclick=()=>drg(5);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code=='Space'){e.preventDefault();mainDown()}else if(e.key=='Shift')g.pump=1;
 else if(e.key=='ArrowDown'){e.preventDefault();dep(.3)}else if(e.key=='ArrowUp'){e.preventDefault();dep(-.3)}else if(e.key=='p'||e.key=='P')podBtn();else if(e.key=='q'||e.key=='Q')drg(-5);else if(e.key=='e'||e.key=='E')drg(5)});
addEventListener('keyup',e=>{if(e.code=='Space')mainUp();if(e.key=='Shift')g.pump=0});
// modals
let tab='shop';
function openM(t){tab=t||tab;const tabs=`<div class="row">${[['shop','Магазин'],['net','Садок'],['loc','Места'],['q','Задания'],['rec','Рекорды'],['adm','⚙']].map(a=>`<button onclick="openM('${a[0]}')" ${a[0]==tab?'style="background:#c47f12"':''}>${a[1]}</button>`).join('')}<button onclick="closeM()">✕</button></div><div>💰 ${S.money} ₽ · Ур. ${lvl()}</div>`;let b='';
 if(tab=='shop'){b+='<h4>Наживка</h4>'+Object.keys(BAIT).map(k=>`<div class="it"><span>${BAIT[k][0]} ×${BAIT[k][2]} <small>(есть ${S.inv[k]||0})</small></span><button onclick="buy('${k}')">${BAIT[k][1]} ₽</button></div>`).join('')+'<h4>Снаряжение</h4>';
  for(const k in GEAR){const cur=GEAR[k][1][S[k]],nx=GEAR[k][1][S[k]+1];b+=`<div class="it"><span>${GEAR[k][0]}: ${cur[0]}</span>${nx?`<button onclick="up('${k}')">${nx[0]} — ${nx[1]} ₽</button>`:'<small>макс.</small>'}</div>`}b+=Object.keys(KITS).filter(k=>k!='f').map(k=>`<div class="it"><span>${KITS[k][0]}</span>${S.kits[k]?'<small>есть</small>':`<button onclick="buyKit('${k}')">${KITS[k][1]} ₽</button>`}</div>`).join('')+`<div class="it"><span>Род-под <small>(вторая удочка, звонок при поклёвке)</small></span>${S.pod?'<small>есть</small>':'<button onclick="buyPod()">2500 ₽</button>'}</div>`;
  b+=`<div class="it"><span>Эхолот <small>(глубина и активность клёва)</small></span>${S.eco?'<small>куплен</small>':'<button onclick="buyEco()">2500 ₽</button>'}</div>`}
 if(tab=='net'){const tot=S.keep.reduce((a,b)=>a+b.price,0);b+=S.keep.length?S.keep.map(f=>`<div class="it"><span>${f.n} ${f.kg} кг</span><span>${f.price} ₽</span></div>`).join('')+`<div class="row"><button onclick="sell()">Продать всё: ${tot} ₽</button></div>`:'<p>Садок пуст</p>'}
 if(tab=='loc')b+=LOCS.map((l,i)=>`<div class="it"><span>${l[0]} <small>глубина ${l[1]} м · ур. ${l[2]}</small></span>${lvl()<l[2]?'<small>закрыто</small>':`<button onclick="goLoc(${i})" ${S.loc==i?'disabled':''}>${S.loc==i?'Здесь':'Ехать'}</button>`}</div>`).join('');
 if(tab=='rec')b+=FISH.map(f=>`<div class="it"><span>${f.n}</span><span>${S.rec[f.n]?S.rec[f.n]+' кг':'—'}</span></div>`).join('');
 if(tab=='adm')b+=admUI();
 if(tab=='q')b+=QS.map((q,i)=>`<div class="it"><span>${q[0]}</span><span>${S.qd[i]?'✅':S.qp[i]+'/'+q[1]+' · '+q[3]+' ₽'}</span></div>`).join('');
 $('mi').innerHTML=tabs+b;$('m').style.display='flex'}
function closeM(){$('m').style.display='none'}
function buy(k){const p=BAIT[k];if(S.money<p[1])return;S.money-=p[1];if(k=='g'){g.gT=300;S.inv.g=0;say('Прикормка брошена!')}else S.inv[k]=(S.inv[k]||0)+p[2];refreshBaits();save();openM()}
function up(k){const nx=GEAR[k][1][S[k]+1];if(S.money<nx[1])return;S.money-=nx[1];S[k]++;g.drag=Math.min(g.drag,line());save();openM()}
function sell(){S.money+=S.keep.reduce((a,b)=>a+b.price,0);S.keep=[];save();openM()}
function goLoc(i){if(g.st!='idle'){say('Сначала смотай снасть');return}S.loc=i;g.dep=Math.min(g.dep,LOCS[i][1]-.2);g.d=0;save();closeM();say('Место: '+LOCS[i][0])}
init3d();mpConnect();$('nm').value=S.name||'';$('nm').onchange=e=>{S.name=e.target.value.slice(0,14);save()};refreshKits();refreshBaits();say('Держи ЗАБРОС (Пробел), отпусти — бросок');
let last=0,fr=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();if(fr++%6==0)tb();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
